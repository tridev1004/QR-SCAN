<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UPI QR Monitor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>UPI QR Monitor</h1>
      <p id="status">Not signed in</p>
      <section id="recipients" hidden>
        <p id="recipientLabel">Send the QR to</p>
        <div id="employeeList"></div>
      </section>
      <p id="watch">Checking this tab…</p>
      <p id="capture"></p>
      <label>
        Backend URL
        <input id="apiBaseUrl" value="http://localhost:4000" />
      </label>
      <label>
        Email
        <input id="email" type="email" value="admin@company.local" autocomplete="username" />
      </label>
      <label>
        Password
        <input id="password" type="password" autocomplete="current-password" />
      </label>
      <div class="actions">
        <button id="signIn" type="button">Sign in</button>
        <button id="signOut" type="button">Sign out</button>
      </div>
    </main>
    <script src="dist/popup.js"></script>
  </body>
</html>
