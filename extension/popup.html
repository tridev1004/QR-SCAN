<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UPI QR Monitor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">UPI QR</p>
        <h1>Monitor</h1>
      </header>
      <p id="status" class="status">Not signed in</p>
      <p id="watch" class="note">Checking this tab…</p>
      <p id="capture" class="note"></p>
      <form id="signInForm">
        <label>
          Email
          <input id="email" type="email" autocomplete="username" placeholder="Admin email" required />
        </label>
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" placeholder="Password" required />
        </label>
        <button id="signIn" type="submit">Sign in</button>
      </form>
      <section id="recipients" hidden>
        <div class="recipient-head">
          <p id="recipientLabel">Choose who receives the QR</p>
          <p id="employeeCount"></p>
        </div>
        <input id="employeeSearch" type="search" placeholder="Search employees" autocomplete="off" />
        <div id="employeeList"></div>
        <button id="sendQr" type="button">Send</button>
        <button id="signOut" type="button">Sign out</button>
      </section>
    </main>
    <script src="dist/popup.js"></script>
  </body>
</html>
